<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>TokenMeter</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --elev: #f4f4f5;
      --border: rgba(24, 24, 27, 0.10);
      --hairline: rgba(24, 24, 27, 0.075);
      --ring-track: rgba(24, 24, 27, 0.13);
      --text: #18181b;
      --sub: #52525b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --accent: #2563eb;
      --cost: #059669;
      --ink-bar: #18181b;
      --warn: #d97706;
      --danger: #dc2626;
      --ok-dot: #16a34a;
      --warn-bg: #fffbeb;
      --warn-fg: #92400e;
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Consolas", monospace;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e;
        --card: #121214;
        --elev: #1c1c20;
        --border: rgba(255, 255, 255, 0.09);
        --hairline: rgba(255, 255, 255, 0.065);
        --ring-track: rgba(255, 255, 255, 0.15);
        --text: #f4f4f5;
        --sub: #a1a1aa;
        --muted: #8a8a93;
        --faint: #52525b;
        --accent: #60a5fa;
        --cost: #34d399;
        --ink-bar: #e4e4e7;
        --warn: #f59e0b;
        --danger: #ef4444;
        --ok-dot: #22c55e;
        --warn-bg: rgba(245, 158, 11, 0.10);
        --warn-fg: #fcd34d;
      }
    }
    html[data-style="glass"] {
      --bg: linear-gradient(155deg, #eef2f6 0%, #f8fafc 100%);
      --card: rgba(255, 255, 255, 0.72);
      --border: rgba(24, 24, 27, 0.09);
      --radius: 13px;
    }
    @media (prefers-color-scheme: dark) {
      html[data-style="glass"] {
        --bg: linear-gradient(155deg, #111318 0%, #0b0c10 100%);
        --card: rgba(28, 28, 34, 0.72);
        --border: rgba(255, 255, 255, 0.13);
      }
    }
    html[data-style="mono"] {
      --bg: #eef2ee;
      --card: #f6f8f6;
      --elev: #e6ece6;
      --border: rgba(16, 32, 24, 0.16);
      --hairline: rgba(16, 32, 24, 0.09);
      --accent: #059669;
      --ink-bar: #059669;
      --radius: 5px;
    }
    @media (prefers-color-scheme: dark) {
      html[data-style="mono"] {
        --bg: #080b09;
        --card: #0c100e;
        --elev: #151d19;
        --border: rgba(16, 185, 129, 0.22);
        --hairline: rgba(16, 185, 129, 0.11);
        --text: #e6f4ec;
        --sub: #9eb7a9;
        --muted: #6f8a7c;
        --faint: #465d51;
        --accent: #10b981;
        --ink-bar: #10b981;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12.5px;
      -webkit-font-smoothing: antialiased;
    }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .brand { font-size: 14.5px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; letter-spacing: -0.015em; line-height: 1; }
    .brand-star { width: 19px; height: 19px; display: block; flex-shrink: 0; filter: drop-shadow(0 0 3px rgba(59, 130, 246, 0.34)); }
    .brand-star .s-main { fill: url(#p-gem-grad); }
    .brand-star .s-sub { fill: #38bdf8; }
    html[data-style="mono"] .brand-star { filter: drop-shadow(0 0 3px rgba(16, 185, 129, 0.36)); }
    html[data-style="mono"] .brand-star .s-main { fill: #10b981; }
    html[data-style="mono"] .brand-star .s-sub { fill: #6ee7b7; }
    .ver { font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
    .actions { display: flex; gap: 6px; }
    button { border: 1px solid var(--border); background: var(--card); color: var(--sub); border-radius: 6px; padding: 3px 9px; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: border-color .14s, color .14s; }
    button:hover { border-color: var(--text); color: var(--text); }

    .banner { padding: 8px 11px; border-radius: 8px; font-size: 11.5px; line-height: 1.5; margin-bottom: 12px; border: 1px solid var(--border); background: var(--card); color: var(--sub); display: flex; align-items: center; gap: 7px; }
    .banner.ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok-dot); flex-shrink: 0; }
    .banner.warn { background: var(--warn-bg); color: var(--warn-fg); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px; backdrop-filter: blur(18px); }
    .hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .hero-speed { display: inline-flex; align-items: baseline; gap: 4px; }
    .hero-num { font-size: 28px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
    .hero-unit { font-size: 11px; color: var(--muted); font-weight: 500; }
    .model-tag { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 165px; }
    .spark-box { color: var(--text); margin: 4px 0 10px; }

    .strip { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hairline); padding-top: 9px; }
    .strip-cell { padding: 0 9px; border-left: 1px solid var(--hairline); }
    .strip-cell:first-child { padding-left: 0; border-left: none; }
    .usage-strip { display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--hairline); }
    .usage-cell { padding: 0 7px; border-left: 1px solid var(--hairline); min-width: 0; }
    .usage-cell:first-child { padding-left: 0; border-left: none; }
    .usage-k { font-size: 10px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }
    .usage-v { font-family: var(--mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--text); }
    .heat { width: 100%; }
    .heat svg { display: block; width: 100%; height: auto; }
    .h-c0 { fill: var(--elev); }
    .h-c1 { fill: #dbeafe; }
    .h-c2 { fill: #93c5fd; }
    .h-c3 { fill: #3b82f6; }
    .h-c4 { fill: #1d4ed8; }
    @media (prefers-color-scheme: dark) {
      .h-c1 { fill: rgba(59, 130, 246, 0.24); }
      .h-c2 { fill: rgba(59, 130, 246, 0.48); }
      .h-c3 { fill: rgba(59, 130, 246, 0.75); }
      .h-c4 { fill: #60a5fa; }
    }
    html[data-style="mono"] .h-c1 { fill: rgba(16, 185, 129, 0.24); }
    html[data-style="mono"] .h-c2 { fill: rgba(16, 185, 129, 0.48); }
    html[data-style="mono"] .h-c3 { fill: rgba(16, 185, 129, 0.75); }
    html[data-style="mono"] .h-c4 { fill: #10b981; }
    .kpi-label { font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
    .kpi-val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .kpi-ctx-row { display: inline-flex; align-items: center; gap: 5px; }
    .ctx-ring { width: 14px; height: 14px; display: block; flex-shrink: 0; }
    .ctx-ring-val { transition: stroke-dashoffset .45s cubic-bezier(0.22, 1, 0.36, 1), stroke .45s ease, stroke-opacity .25s ease; }

    .sec-title { font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sec-title > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-item { margin-bottom: 9px; }
    .q-item:last-child { margin-bottom: 0; }
    .q-meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; margin-bottom: 4px; gap: 6px; }
    .q-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-pair { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--text); flex-shrink: 0; }
    .q-slash { color: var(--faint); margin: 0 1.5px; font-weight: 400; }
    .q-sub { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 11px; }
    .q-tag { min-width: 24px; flex-shrink: 0; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
    .q-track { position: relative; flex: 1; height: 9px; display: flex; align-items: center; }
    .q-bar { width: 100%; height: 3.5px; border-radius: 99px; background: var(--elev); overflow: hidden; }
    .q-fill { height: 100%; background: var(--ink-bar); border-radius: 99px; }
    .q-fill.warn { background: var(--warn); }
    .q-fill.danger { background: var(--danger); }
    .q-tick { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--text); opacity: 0.58; border-radius: 1px; transform: translateX(-50%); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; padding: 2px; gap: 2px; background: var(--elev); margin-top: 8px; }
    .seg button { border: none; background: transparent; padding: 3px 9px; border-radius: 5px; font-size: 11px; color: var(--muted); }
    .seg button.active { background: var(--card); color: var(--text); font-weight: 600; }
    .q-sub-val { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; min-width: 82px; text-align: right; display: inline-flex; justify-content: flex-end; gap: 6px; }
    .q-sub-val b { color: var(--text); font-weight: 500; }
    .q-sub-val em { font-style: normal; color: var(--faint); }

    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-size: 10.5px; font-weight: 500; }
    td:not(:first-child) { font-family: var(--mono); font-size: 11px; }
    .cost-sub { display: block; font-size: 9.5px; color: var(--cost); font-weight: 600; margin-top: 1px; }
    .rate-sub { display: block; font-size: 9px; color: var(--faint); font-family: var(--mono); margin-top: 1px; }
    .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11.5px; cursor: pointer; transition: all .14s; }
    .pill input { display: none; }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .pill.on { border-color: var(--text); color: var(--text); background: var(--elev); font-weight: 500; }
    .pill.on .pill-dot { background: var(--accent); }
  </style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <svg class="brand-star" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="p-gem-grad" x1="2" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="52%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <path class="s-main" d="M10.2 3.2 C11.3 9.4 13.4 11.5 19.6 12.6 C13.4 13.7 11.3 15.8 10.2 22 C9.1 15.8 7 13.7 0.8 12.6 C7 11.5 9.1 9.4 10.2 3.2 Z"/>
        <path class="s-sub" d="M19.4 2.4 C19.9 4.5 20.6 5.2 22.7 5.7 C20.6 6.2 19.9 6.9 19.4 9 C18.9 6.9 18.2 6.2 16.1 5.7 C18.2 5.2 18.9 4.5 19.4 2.4 Z"/>
      </svg>
      <span data-k="brand">TokenMeter</span>
      <span id="ver" class="ver"></span>
    </div>
    <div class="actions">
      <button id="lang-btn" type="button">EN</button>
      <button id="refresh-btn" type="button">刷新</button>
    </div>
  </div>

  <div id="diag-banner" class="banner warn"></div>

  <div class="card">
    <div class="hero-top">
      <div class="hero-speed">
        <span class="hero-num" id="k-latest">--</span>
        <span class="hero-unit" data-k="speedUnit">tok/s</span>
      </div>
      <span class="model-tag" id="model-name"></span>
    </div>
    <div class="spark-box" id="sparkline"></div>
    <div class="strip">
      <div class="strip-cell"><div class="kpi-label" data-k="sessionSpeed"></div><div class="kpi-val" id="k-session">--</div></div>
      <div class="strip-cell"><div class="kpi-label" data-k="cacheHit"></div><div class="kpi-val" id="k-cache">--</div></div>
      <div class="strip-cell"><div class="kpi-label" data-k="context"></div><div class="kpi-val kpi-ctx-row"><span id="k-ctx-ring"></span><span id="k-ctx">--</span></div></div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title"><span data-k="usageOverview"></span><span id="u-meta" style="font-family:var(--mono);font-size:10px;"></span></div>
    <div class="usage-strip">
      <div class="usage-cell"><div class="usage-k" data-k="today"></div><div class="usage-v" id="u-today">0</div></div>
      <div class="usage-cell"><div class="usage-k" data-k="week"></div><div class="usage-v" id="u-week">0</div></div>
      <div class="usage-cell"><div class="usage-k" data-k="month"></div><div class="usage-v" id="u-month">0</div></div>
      <div class="usage-cell"><div class="usage-k" data-k="lifetime"></div><div class="usage-v" id="u-total">0</div></div>
    </div>
    <div class="heat" id="heatmap"></div>
  </div>

  <div class="card">
    <div class="sec-title"><span data-k="quotaTitle"></span><span id="quota-legend" style="font-family:var(--mono);font-size:10px;"></span></div>
    <div id="quotas"></div>
  </div>

  <div class="card">
    <div class="sec-title"><span data-k="modelRankTitle"></span><span id="today-sum" style="font-family:var(--mono);font-size:10.5px;"></span></div>
    <table><thead><tr><th data-k="colModel"></th><th data-k="colTotal"></th><th data-k="colAvgTps"></th><th data-k="colReq"></th></tr></thead><tbody id="rank-body"></tbody></table>
  </div>

  <div class="card">
    <div class="sec-title"><span data-k="customizeTitle"></span></div>
    <div class="toggles" id="toggles"></div>
    <div class="seg" id="theme-seg"></div>
  </div>

  <script src="./i18n.js"></script>
  <script src="./panel.js"></script>
</body>
</html>
